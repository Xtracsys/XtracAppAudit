name: Bug report
description: Report a reproducible defect without private inventory data.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps using fictional data where possible
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App version, macOS version and CPU architecture
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I reviewed attachments and removed private paths, tokens and inventory details.
          required: true
